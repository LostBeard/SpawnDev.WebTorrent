<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        var path = window.location.pathname.split('/');
        var isGitHubPages = window.location.hostname.includes('github.io');
        var baseHref = (isGitHubPages && path[1] === 'SpawnDev.WebTorrent') ? '/SpawnDev.WebTorrent/' : '/';
        document.write('<base href="' + baseHref + '" />');
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpawnDev.WebTorrent</title>
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="SpawnDev.WebTorrent.Demo.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- Registers SW (COI headers + torrent streaming), waits for ready, then loads Blazor -->
    <script src="webtorrent-sw.js"></script>
</body>

</html>
